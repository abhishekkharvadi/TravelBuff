version: '3.8'

services:
  travelbuff:
    build: .
    container_name: travelbuff-app
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      # Persistent bind mount directory on host for easy database backups and receipt photos retrieval
      - ./data:/data
    environment:
      - PORT=5005
      - DATABASE_DIR=/data
      - UPLOADS_DIR=/data/uploads
      - JWT_SECRET=travelbuff-production-secret-key-change-me
