version: '3.8'

services:
  travelbuff:
    image: abhishekkharvadi/travelbuff:latest
    build: .
    container_name: travelbuff-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persistent bind mount directory on host for easy database backups and receipt photos retrieval
      - ./data:/data
    environment:
      - PORT=5000
      - DATABASE_DIR=/data
      - UPLOADS_DIR=/data/uploads
      - JWT_SECRET=NuH%MweZ$XwESU4PeSyyPQ!XI#QsbCXn6ls&KdeL^F
