<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" />
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.9" />
  <!-- Inner Ring (dashed/ticks) -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 3" stroke-opacity="0.6" />
  <!-- Needle -->
  <path d="M 50 24 L 56 46 L 50 42 Z" fill="#ff4b4b" filter="url(#glow)" />
  <path d="M 50 76 L 44 54 L 50 58 Z" fill="#ffffff" stroke-opacity="0.9" />
  <path d="M 50 24 L 44 46 L 50 42 Z" fill="#ff6b6b" filter="url(#glow)" />
  <path d="M 50 76 L 56 54 L 50 58 Z" fill="#e2e8f0" stroke-opacity="0.9" />
  <!-- Center Pivot -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
  <circle cx="50" cy="50" r="2" fill="#5b21b6" />
</svg>
